name: ro_wholesale_dealer_app
description: "A premium B2B ecommerce Flutter app for RO and water purification wholesale dealers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0+1
  go_router: ^14.2.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  file_picker: ^13.1.0
  excel: ^4.0.6
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1
  razorpay_flutter: ^1.4.7
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
